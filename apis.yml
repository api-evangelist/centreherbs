description: Centreherbs is the brand of Beijing Shengtaier Biotechnology Co., Ltd.,
  a veterinary pharmaceutical company founded in 1999 and headquartered in the Daxing
  Biopharmaceutical Industrial Park, Beijing, China. An integrated research, development,
  production, and distribution organization for animal health, it specializes in veterinary
  traditional Chinese medicine preparations, animal vaccines for poultry and livestock,
  plant-based premixed feed additives, and pet health products, backed by four wholly-owned
  subsidiaries and an internal biotech research institute. It is a healthcare portfolio
  company of Qiming Venture Partners. The company operates a corporate marketing website
  and publishes no public API, developer portal, or machine-readable specification.
